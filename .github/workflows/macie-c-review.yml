name: MACIE C Controlled Review Integration

on:
  pull_request:
    branches: [master]
    paths:
      - "prod_shell/**"
      - "macie_web.py"
      - ".github/workflows/macie-c-review.yml"
  push:
    branches: [master]
    paths:
      - "prod_shell/**"
      - "macie_web.py"
      - ".github/workflows/macie-c-review.yml"

permissions:
  contents: read

jobs:
  review-fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pytest-asyncio httpx flask python-docx cryptography SQLAlchemy psycopg[binary]
      - name: Verify MACIE C real engine code with synthetic reviewers
        run: python -m pytest -q -s prod_shell/tests/test_macie_c.py prod_shell/tests/test_macie_c_openrouter.py prod_shell/tests/test_macie_c_portal.py prod_shell/tests/test_commercial_access.py prod_shell/tests/test_commercial_store.py prod_shell/tests/test_customer_openrouter_keys.py prod_shell/tests/test_isolation.py sfc_ai_router/tests/test_router.py
      - name: Check Python syntax
        run: python -m compileall -q prod_shell/src prod_shell/tests sfc_ai_router macie_web.py

# This workflow deliberately has NO provider API credentials.
# Green here means software integration passes, NOT live multi-model readiness.

  postgres-commercial-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: macie_ci_test
          POSTGRES_PASSWORD: ephemeral_ci_password_only
          POSTGRES_DB: macie_ci_test
        options: >-
          --health-cmd "pg_isready -U macie_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MACIE_C_TEST_POSTGRES_URL: postgresql+psycopg://macie_ci_test:ephemeral_ci_password_only@127.0.0.1:5432/macie_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest SQLAlchemy "psycopg[binary]" cryptography httpx
      - name: Verify true PostgreSQL tenant isolation and key encryption
        run: python -m pytest -q -s prod_shell/tests/test_commercial_postgres.py

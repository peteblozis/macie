name: MACIE C Controlled Review Integration

on:
  pull_request:
    branches: [master]
    paths:
      - "prod_shell/**"
      - "macie_web.py"
      - ".github/workflows/macie-c-review.yml"
  push:
    branches: [master]
    paths:
      - "prod_shell/**"
      - "macie_web.py"
      - ".github/workflows/macie-c-review.yml"

permissions:
  contents: read

jobs:
  review-fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Verify MACIE C real engine code with synthetic reviewers
        run: python -m pytest -q -s prod_shell/tests/test_macie_c.py prod_shell/tests/test_isolation.py
      - name: Check Python syntax
        run: python -m compileall -q prod_shell/src prod_shell/tests macie_web.py

# This workflow deliberately has NO provider API credentials.
# Green here means software integration passes, NOT live multi-model readiness.

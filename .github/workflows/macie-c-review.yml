name: MACIE C Controlled Review Integration

on:
  pull_request:
    branches: [master]
    paths:
      - "engine/**"
      - "core_shell/**"
      - "registry/**"
      - "sfc_ai_router/**"
      - "prod_shell/**"
      - "macie_web.py"
      - ".github/workflows/macie-c-review.yml"
  push:
    branches: [master]
    paths:
      - "engine/**"
      - "core_shell/**"
      - "registry/**"
      - "sfc_ai_router/**"
      - "prod_shell/**"
      - "macie_web.py"
      - ".github/workflows/macie-c-review.yml"

permissions:
  contents: read

jobs:
  review-fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pytest-asyncio httpx flask
      - name: Verify existing engine, review endpoint, routing and failure cases offline
        run: python -m pytest -q engine/tests core_shell/tests prod_shell/tests registry/tests sfc_ai_router/tests --junitxml=test-results/macie-offline.xml
      - name: Verify engine isolation
        run: python scripts/check_engine_purity.py
      - name: Check Python syntax
        run: python -m compileall -q prod_shell/src prod_shell/tests sfc_ai_router macie_web.py
      - name: Retain offline test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macie-offline-tests-${{ github.sha }}
          path: test-results/
          retention-days: 14

# This workflow deliberately has NO provider API credentials.
# Green here means software integration passes, NOT live multi-model readiness.

name: Private UPSCAN protocol tests
on:
  pull_request:
    branches: [master]
    paths:
      - 'core_shell/src/upscan_*.py'
      - 'core_shell/tests/test_upscan_consensus.py'
      - 'macie_web.py'
      - '.github/workflows/upscan-consensus.yml'
permissions:
  contents: read
jobs:
  fixture-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest flask
      - run: python -m pytest core_shell/tests/test_upscan_consensus.py -q
      - run: python -m compileall -q core_shell/src/upscan_consensus.py core_shell/src/upscan_bridge.py macie_web.py
# No provider credentials or live model calls. Green is fixture validation only.

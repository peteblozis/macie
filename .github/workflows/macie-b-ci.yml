name: MACIE B consensus tests
on:
  pull_request:
    branches: [master]
  push:
    branches: [macie-product-boundaries-20261012]
jobs:
  macie-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest prod_shell.tests.test_macie_b -v
